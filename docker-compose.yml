services:
  chemify:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chemify-production
    restart: unless-stopped
    ports:
      - "${PORT_PRIMARY:-4326}:4326"
      - "${PORT_SECONDARY:-5467}:5467"
    environment:
      - NODE_ENV=production
      - DOMAIN=${DOMAIN:-chemify.solaymanbuilds.com}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4326/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "com.chemify.project=chemify"
      - "com.chemify.description=Modern Chemistry Visualized"
      - "com.chemify.environment=production"
      - "com.chemify.domain=chemify.solaymanbuilds.com"
